<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>
  <!-- Calculator body -->
  <rect x="16" y="14" width="32" height="36" rx="5" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- Display area -->
  <rect x="20" y="18" width="24" height="8" rx="2" fill="rgba(255,255,255,0.25)"/>
  <!-- Display text line -->
  <rect x="33" y="21" width="8" height="2" rx="1" fill="white" opacity="0.9"/>
  <!-- Button grid -->
  <rect x="20" y="30" width="5" height="4" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="27" y="30" width="5" height="4" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="34" y="30" width="5" height="4" rx="1.5" fill="#60a5fa"/>
  <rect x="20" y="36" width="5" height="4" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="27" y="36" width="5" height="4" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="34" y="36" width="5" height="4" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="20" y="42" width="12" height="4" rx="1.5" fill="#8b5cf6"/>
  <rect x="34" y="42" width="5" height="4" rx="1.5" fill="#60a5fa"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
</svg>
