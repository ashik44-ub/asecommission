<section id="records-sec" class="tab-section">
  
  <div class="records-control-bar glassmorphic">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-records-input" placeholder="Search by name, period or totals...">
    </div>
    
    <div class="filter-actions">
      <button class="btn btn-secondary-outline" id="btn-export-csv">
        <i class="fa-solid fa-file-csv"></i> Export to CSV
      </button>
      <button class="btn btn-secondary-outline" id="btn-print-report" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Print Report
      </button>
    </div>
  </div>

  <div class="records-table-container glassmorphic">
    <div class="table-responsive">
      <table class="data-table" id="all-records-table">
        <thead>
          <tr>
            <th>Representative Name</th>
            <th>Period</th>
            <th class="text-right">Total Collection</th>
            <th class="text-right">Collection Rate</th>
            <th class="text-right">Coll. Commission</th>
            <th class="text-right">Cash Bonus</th>
            <th class="text-right">Service Comm.</th>
            <th class="text-right font-semibold">Grand Total</th>
            <th>Calculation Date</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="all-records-tbody">
          <tr>
            <td colspan="10" class="text-center text-muted">No records found. Add a record on the Calculator tab.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="table-footer">
      <div class="pagination-info" id="pagination-info">Showing 0 of 0 entries</div>
      <div class="pagination-controls" id="pagination-controls">
        <button class="btn-pagination" id="btn-prev-page" disabled><i class="fa-solid fa-chevron-left"></i></button>
        <span class="page-number active" id="current-page-num">1</span>
        <button class="btn-pagination" id="btn-next-page" disabled><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </div>

</section>
